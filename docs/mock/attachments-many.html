<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Many attachments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFF5F2;--text:#44544A;--quiet:#7A8684;--line:#DAE7DF;--outline:#C3CEC7;--green:#37BD69;--gdark:#006D35;--tint:#E8F4F2;--red:#E93353}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,sans-serif;color:var(--text);padding:32px}
h1{font-size:24px;font-weight:600;margin:0 0 6px}.lead{margin:0 0 28px;color:var(--quiet);font-size:14px;max-width:960px}
.opt{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;max-width:1240px}.opt h2{font-size:18px;font-weight:600;margin:0 0 4px}.why{font-size:14px;color:var(--quiet);margin:0 0 18px;max-width:960px}
.rec{display:inline-block;background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;margin-left:8px;vertical-align:middle}
.sec{font-size:20px;font-weight:600;margin:0 0 16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.fields{display:flex;flex-direction:column;gap:20px;padding-top:6px}
.f{position:relative;height:56px;border:1px solid var(--outline);border-radius:8px;padding:0 14px;display:flex;align-items:center;font-size:16px}.f label{position:absolute;top:-8px;left:10px;background:#fff;padding:0 4px;font-size:12px;color:var(--quiet)}
.panel{height:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;margin-bottom:8px}.ph b{font-size:14px;color:var(--quiet);font-weight:600}.ph a{margin-left:auto;font-size:13px;font-weight:500;color:var(--gdark);text-decoration:none;text-transform:uppercase;letter-spacing:.4px}
.tile{width:88px;height:88px;border-radius:8px;border:1px solid var(--line);position:relative;flex:none;overflow:hidden}
.tile .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;display:grid;place-items:center}
.cap{font-size:12px;width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.add{width:88px;height:88px;border:1px dashed var(--outline);border-radius:8px;display:grid;place-items:center;color:var(--green);font-size:24px;flex:none}
.more{width:88px;height:88px;border-radius:8px;background:rgba(0,0,0,.05);display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--text);flex:none}
.wrapgrid{display:flex;flex-wrap:wrap;gap:12px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.list{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:166px;padding-right:4px}.lr{display:flex;align-items:center;gap:10px;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 8px}.lr .t{width:30px;height:30px;border-radius:4px;flex:none}.lr .n{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .s{font-size:12px;color:var(--quiet)}.lr .d{color:var(--red);font-size:14px}
.btn{height:40px;padding:0 16px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--outline);color:var(--green);background:#fff}
.stack{position:relative;width:140px;height:120px;flex:none}.stack .tile{position:absolute;width:96px;height:110px}
.sheetmock{margin-top:16px;border:1px dashed var(--outline);border-radius:12px;padding:16px;background:#FAFCFB}.sheetmock .t1{font-size:13px;color:var(--quiet);margin-bottom:10px}
</style></head><body>
<h1>Attachments when there are 5 to 10 files</h1>
<p class="lead">Each option shows the invoice details section with 10 files attached. The panel on the right should stay level with the three fields on the left. Today it grows to three rows, about 380px against the fields' 210px.</p>
<div id="root"></div>
<script>
const COL=['#FBFAF6','#F4F1E8','#EEF5FF','#F7F2FF','#FFF4EC','#F1F8F3','#FDF6F0','#F0F4F8','#FAF7EE','#F5F0FA']
const F=Array.from({length:10},(_,i)=>({n:i===0?'GVF-2610-061.pdf':`Invoice page ${i+1}.jpg`,c:COL[i],s:`${200+i*37} KB`}))
const tile=(f,x=true)=>`<div><div class="tile" style="background:linear-gradient(160deg,${f.c} 0 60%,#E3DED0 60%)">${x?'<span class="x">✕</span>':''}</div><div class="cap">${f.n}</div></div>`
const fields=`<div class="fields"><div class="f"><label>Invoice number*</label><b>GVF/2610/061</b></div><div class="f"><label>Vendor*</label>Green Valley Farms</div><div class="f"><label>Invoice date*</label>15/10/2026</div></div>`
const sec=right=>`<div class="sec">1. Invoice details</div><div class="split">${fields}${right}</div>`
const O=[
 {t:'Today',w:'The tiles wrap into three rows and the panel grows well past the fields, leaving an empty block under Invoice date.',
  r:()=>sec(`<div class="panel" style="height:auto"><div class="ph"><b>Attachments · 10</b></div><div class="wrapgrid">${F.map(f=>tile(f)).join('')}<div class="add">＋</div></div></div>`).replace('align-items:stretch','')},
 {t:'A · Two rows of smaller tiles, then “+n”',rec:1,w:'Tiles drop to 64px without names (the name shows on hover), so two rows fit beside the fields: up to 12 files, then a “+n” tile. View all in the panel header opens every file in the viewer, where the clerk can step through and remove them. The panel never grows past the fields.',
  r:()=>sec(`<div class="panel"><div class="ph"><b>Attachments · 10</b><a href="#">View all</a></div><div class="wrapgrid" style="gap:10px">${F.map(f=>`<div class="tile" title="${f.n}" style="width:64px;height:64px;background:linear-gradient(160deg,${f.c} 0 60%,#E3DED0 60%)"><span class="x">✕</span></div>`).join('')}<div class="add" style="width:64px;height:64px">＋</div></div></div>`)},
 {t:'B · One row that scrolls sideways',w:'All files sit in a single row with a sideways scroll. The panel stays one row high, but files after the fifth are out of sight, and sideways scroll is easy to miss with a mouse.',
  r:()=>sec(`<div class="panel"><div class="ph"><b>Attachments · 10</b></div><div class="strip">${F.map(f=>tile(f)).join('')}<div class="add">＋</div></div></div>`)},
 {t:'C · A list of files that scrolls',w:'Each file is one 44px row with a small thumbnail, name, size and remove, in a list that scrolls inside the panel. Names are readable in full, but the papers are too small to recognise.',
  r:()=>sec(`<div class="panel"><div class="ph"><b>Attachments · 10</b><a href="#">＋ Add file</a></div><div class="list">${F.map(f=>`<div class="lr"><div class="t" style="background:${f.c};border:1px solid var(--line)"></div><span class="n">${f.n}</span><span class="s">${f.s}</span><span class="d">✕</span></div>`).join('')}</div></div>`)},
 {t:'D · A stack with View all',w:'The panel shows the first paper with the rest stacked behind it, the count, and two actions: View all and Add file. It is the calmest at rest, but the clerk has to open it to see or remove anything.',
  r:()=>sec(`<div class="panel" style="justify-content:center"><div style="display:flex;align-items:center;gap:20px"><div class="stack">${[2,1,0].map(k=>`<div class="tile" style="left:${k*14}px;top:${k*4}px;background:linear-gradient(160deg,${F[k].c} 0 60%,#E3DED0 60%);box-shadow:0 1px 3px rgba(0,0,0,.12)"></div>`).join('')}</div><div><div style="font-size:16px;font-weight:600">10 attachments</div><div style="font-size:13px;color:var(--quiet);margin:2px 0 12px">GVF-2610-061.pdf and 9 more</div><div style="display:flex;gap:8px"><span class="btn">View all</span><span class="btn">＋ Add file</span></div></div></div></div>`)}]
document.getElementById('root').innerHTML=O.map(o=>`<div class="opt"><h2>${o.t}${o.rec?'<span class="rec">Recommended</span>':''}</h2><p class="why">${o.w}</p>${o.r()}</div>`).join('')
</script></body></html>
