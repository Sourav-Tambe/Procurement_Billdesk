<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challan card options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFF5F2;--white:#fff;--text:#44544A;--quiet:#7A8684;--line:#DAE7DF;--outline:#C3CEC7;--green:#37BD69;--gdark:#006D35;--tint:#E1F9ED;--ink:#1F515B;--red:#E93353;--tert:#FA6140}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,sans-serif;color:var(--text);padding:32px}
h1{font-size:24px;font-weight:600;margin:0 0 6px}.lead{margin:0 0 28px;color:var(--quiet);font-size:14px}
.opt{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px}.opt h2{font-size:18px;font-weight:600;margin:0 0 4px}.why{font-size:14px;color:var(--quiet);margin:0 0 18px;max-width:900px}
.sec-h{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:center}.sec-h .b{margin-left:auto;height:36px;padding:0 14px;border:1px solid var(--outline);border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--green);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.ic{width:28px;height:28px;display:inline-grid;place-items:center;vertical-align:middle;color:var(--quiet);font-size:15px;border-radius:6px}
.tile{width:40px;height:40px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;background:#E8F4F2;color:var(--gdark);white-space:nowrap}
.pill.warn{background:#FFBDA833;color:var(--tert)}
.no{font-size:16px;font-weight:600;color:var(--text)}.sub{font-size:13px;color:var(--quiet)}
.qty{font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
/* A */
.a{display:flex;flex-direction:column;gap:8px}.a .card{display:grid;grid-template-columns:44px 210px minmax(0,1fr) 150px auto;align-items:center;gap:16px;padding:12px 12px 12px 14px}
.a .items{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a .items b{font-weight:400;color:var(--quiet)}
/* B */
.b-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.b .card{overflow:hidden;display:flex;flex-direction:column}.b ul{flex:1}.b .hd{display:flex;align-items:center;gap:12px;padding:14px 10px 12px 16px}
.b ul{list-style:none;margin:0;padding:4px 16px;border-top:1px solid var(--line)}.b li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid #eef3f1}.b li:last-child{border-bottom:0}
.b li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.b .more{color:var(--quiet);font-size:13px}
.b .ft{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#F7FAF9;border-top:1px solid var(--line);font-size:13px;color:var(--quiet)}
/* C */
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.c .card{padding:16px;display:flex;flex-direction:column;gap:14px}.c .top{display:flex;align-items:flex-start;gap:8px}
.c .stats{display:grid;grid-template-columns:minmax(0,.6fr) minmax(0,1fr) minmax(0,1.3fr);border:1px solid var(--line);border-radius:10px}.c .stats div{padding:10px 12px}.c .stats div+div{border-left:1px solid var(--line)}
.c .k{font-size:11px;color:var(--quiet);text-transform:uppercase;letter-spacing:.4px}.c .v{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .names{font-size:13px;color:var(--text);line-height:1.5}
/* D */
.d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.d .card{display:grid;grid-template-columns:96px minmax(0,1fr);overflow:hidden}
.d .paper{background:#F4F1E8;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:5px}.d .paper i{display:block;height:5px;border-radius:3px;background:#D9D2BF}.d .paper .t{font-size:9px;font-weight:700;color:#5a5446;letter-spacing:.3px}
.d .bd{padding:14px 10px 12px 16px;display:flex;flex-direction:column;gap:8px}.d .row{display:flex;align-items:center;gap:8px}
.d .items{font-size:14px;line-height:1.55}.d .items div{display:flex;justify-content:space-between;gap:10px}.d .items div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chiprow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border:1px solid var(--outline);border-radius:8px;position:relative}
.chiprow label{position:absolute;top:-8px;left:9px;background:#fff;padding:0 4px;font-size:11px;color:var(--quiet)}
.tok{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;border-radius:8px;background:var(--bg);font-size:13px}.tok b{font-weight:600}.tok .s{color:var(--quiet)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.t th{background:#E8F4F2;text-align:left;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:12px;color:var(--text)}
table.t td{padding:12px;border-top:1px solid var(--line)}table.t .r{text-align:right}
tr.grp td{background:#F7FAF9;font-size:13px}tr.grp td .no{font-size:14px}
.in{display:inline-block;width:84px;height:34px;border:1px solid var(--outline);border-radius:6px;padding:7px 8px;text-align:right}
.split2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.rail{display:flex;flex-direction:column;gap:8px}.rc{border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}.rc.on{border:1.5px solid var(--green);background:#F7FDF9}
.src{font-size:12px;color:var(--quiet);margin:2px 0 8px}
</style></head><body>
<h1>Challan card, section “2. Challans”</h1>
<p class="lead">Eight options, filled with real challans. A to D are card styles; E to H are layouts other bill and invoice tools use. Each one keeps the area name and the item names readable and gives the bottom of the card a job.</p>
<div id="root"></div>
<script>
const DCS=[
 {no:'ND-1013',date:'14 Oct 26',area:'Central Store',by:'Lakshmi Menon',ai:false,items:[['Milk toned 1 ltr','40 ltr'],['Egg (table, white) tray','30 trays']]},
 {no:'GVF-3303',date:'15 Oct 26',area:'Rescue Kitchen',by:'Anand Rao',ai:true,items:[['Cucumber','45 kg'],['Beetroot','15 kg'],['Lettuce iceberg','60 kg'],['Carrot ooty','60 kg']]},
 {no:'SLA/2610/3818',date:'14 Oct 26',area:'Rescue Kitchen',by:'Anand Rao',ai:false,rej:'2 kg rejected',items:[['Pumpkin yellow','15 kg'],['Watermelon kiran','40 kg']]}]
const truck='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#006D35" stroke-width="1.8"><rect x="1" y="6" width="13" height="10" rx="1.5"/><path d="M14 9h4l3 3v4h-7z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path d="M4.5 11l2 2 4-4"/></svg>'
const act='<span class="ic" title="View">◉</span><span class="ic" title="Remove">✕</span>'
const robot='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 1 3.7V7h4a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h4V5.7A2 2 0 0 1 12 2zM9 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>'
const tags=d=>`${d.ai?`<span class="pill">${robot}On the bill</span>`:''}${d.rej?`<span class="pill warn">${d.rej}</span>`:''}`
const head=t=>`<div class="sec-h">2. Challans<span class="b">＋ Add challans</span></div>`
const O=[
 {t:'A · One row per challan',w:'A full-width row: number with date and area, the items in one line, the count, then the tags and actions. Reads like a short table and stays tidy with 10 challans.',
  r:()=>`<div class="a">${DCS.map(d=>`<div class="card"><div class="tile">${truck}</div><div><div class="no">${d.no}</div><div class="sub">${d.date} · ${d.area}</div></div><div class="items">${d.items.map(i=>`${i[0]} <b>${i[1]}</b>`).join(' · ')}</div><div style="display:flex;gap:6px;justify-content:flex-end">${tags(d)}</div><div style="display:flex">${act}</div></div>`).join('')}</div>`},
 {t:'B · Ticket with its items and quantities',w:'Two or three per row. The header carries the number, date and area. The body lists up to three items with the received quantity on the right. The footer says who received it, plus the tags. Best of the card styles.',
  r:()=>`<div class="b b-grid">${DCS.map(d=>`<div class="card"><div class="hd"><div class="tile">${truck}</div><div style="flex:1;min-width:0"><div class="no">${d.no}</div><div class="sub">${d.date} · ${d.area}</div></div>${act}</div><ul>${d.items.slice(0,3).map(i=>`<li><span>${i[0]}</span><span class="qty">${i[1]}</span></li>`).join('')}${d.items.length>3?`<li class="more">+${d.items.length-3} more</li>`:''}</ul><div class="ft"><span style="flex:1">${d.items.length} items · received by ${d.by}</span>${tags(d)}</div></div>`).join('')}</div>`},
 {t:'C · Summary card with three facts',w:'Number and actions on top, then three facts in a strip: items, date and area. Item names sit below as plain text. Light, and the facts line up across cards.',
  r:()=>`<div class="c c-grid">${DCS.map(d=>`<div class="card"><div class="top"><div class="tile">${truck}</div><div style="flex:1;min-width:0;padding-top:2px"><div class="no">${d.no}</div><div style="display:flex;gap:6px;margin-top:6px">${tags(d)}</div></div>${act}</div><div class="stats"><div><div class="k">Items</div><div class="v">${d.items.length}</div></div><div><div class="k">Received</div><div class="v">${d.date}</div></div><div><div class="k">Area</div><div class="v">${d.area}</div></div></div><div class="names">${d.items.map(i=>i[0]).join(', ')}</div></div>`).join('')}</div>`},
 {t:'D · Challan slip with a paper thumbnail',w:'The left strip is a small picture of the challan paper (the signed DC once it exists), so the card reads as a document. Items and quantities sit beside it.',
  r:()=>`<div class="d d-grid">${DCS.map(d=>`<div class="card"><div class="paper"><span class="t">DELIVERY CHALLAN</span><i style="width:70%"></i><i></i><i style="width:85%"></i><i style="width:60%"></i><i></i><i style="width:75%"></i></div><div class="bd"><div class="row"><div style="flex:1;min-width:0"><div class="no">${d.no}</div><div class="sub">${d.date} · ${d.area}</div></div>${act}</div><div class="items">${d.items.slice(0,3).map(i=>`<div><span>${i[0]}</span><span class="qty">${i[1]}</span></div>`).join('')}${d.items.length>3?`<div class="sub">+${d.items.length-3} more</div>`:''}</div><div class="row" style="margin-top:auto">${tags(d)}</div></div></div>`).join('')}</div>`}]

const LN=DCS.flatMap(d=>d.items.map(i=>({dc:d.no,n:i[0],q:i[1]})))
O.push(
 {t:'E · Challans as reference chips in one field',s:'How Odoo and SAP header fields show linked orders: tokens in a field, details on demand.',w:'The challans live in one field, each a token with number, date and item count. View opens the goods receipt and × removes. Smallest footprint, and the Items table does the detail.',
  r:()=>`<div class="chiprow"><label>Challans*</label>${DCS.map(d=>`<span class="tok"><b>${d.no}</b><span class="s">${d.date} · ${d.items.length} items</span><span class="ic" style="width:22px">◉</span><span class="ic" style="width:22px">✕</span></span>`).join('')}<span class="tok" style="background:none;border:1px dashed var(--outline);color:var(--green)">＋ Add challans</span></div>`},
 {t:'F · Challan references table',s:'Like SAP Fiori and Infor M3 supplier-invoice reference tables, and the compliance table look.',w:'A small table, one challan per row, with date, area, items, received by and tags. It is the same structure as every other list in Bill Desk, so nothing new to learn.',
  r:()=>`<table class="t"><thead><tr><th>Challan</th><th>Received</th><th>Area</th><th class="r">Items</th><th>Received by</th><th></th><th></th></tr></thead><tbody>${DCS.map(d=>`<tr><td><b>${d.no}</b></td><td>${d.date}</td><td>${d.area}</td><td class="r">${d.items.length}</td><td>${d.by}</td><td>${tags(d)}</td><td class="r" style="white-space:nowrap">${act}</td></tr>`).join('')}</tbody></table>`},
 {t:'G · Items grouped under each challan, one table',s:'Like Zoho Books bills made from purchase orders, where the lines sit under each order.',w:'Sections 2 and 3 merge. Each challan is a group row in the Items table, with its own lines under it, received beside billed. The challan facts appear once, right where the clerk matches the numbers. Recommended.',
  r:()=>`<div class="sec-h" style="margin-top:-8px">3. Items · ${LN.length}<span class="b">＋ Add challans</span></div><table class="t"><thead><tr><th>Item</th><th class="r">Received</th><th class="r">Billed</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>${DCS.map(d=>`<tr class="grp"><td colspan="4"><span class="no">${d.no}</span> <span class="sub">· ${d.date} · ${d.area} · ${d.items.length} items</span> ${tags(d)}</td><td class="r" style="white-space:nowrap">${act}</td></tr>${d.items.map(i=>`<tr><td style="padding-left:28px">${i[0]}</td><td class="r qty">${i[1]}</td><td class="r"><span class="in">${parseFloat(i[1])}</span></td><td class="r"><span class="in">42</span></td><td class="r"><b>₹${(parseFloat(i[1])*42).toLocaleString('en-IN')}</b></td></tr>`).join('')}`).join('')}</tbody></table>`},
 {t:'H · Challan rail beside the items',s:'Like AP tools such as Stampli and Ramp, where the source documents sit in a side list next to the lines.',w:'A narrow list of challans on the left and the Items table on the right. Picking a challan highlights its lines. Good when bills cover many challans.',
  r:()=>`<div class="split2"><div class="rail">${DCS.map((d,k)=>`<div class="rc ${k===1?'on':''}"><div class="tile" style="width:34px;height:34px">${truck}</div><div style="flex:1;min-width:0"><div class="no" style="font-size:14px">${d.no}</div><div class="sub">${d.date} · ${d.items.length} items</div></div>${k===1?'<span class="pill">'+robot+'</span>':''}</div>`).join('')}<div class="rc" style="border-style:dashed;color:var(--green);justify-content:center;font-size:13px;font-weight:500">＋ ADD CHALLANS</div></div><table class="t"><thead><tr><th>Item</th><th>Challan</th><th class="r">Received</th><th class="r">Billed</th></tr></thead><tbody>${LN.map(l=>`<tr style="${l.dc==='GVF-3303'?'background:#F7FDF9':''}"><td>${l.n}</td><td class="sub">${l.dc}</td><td class="r qty">${l.q}</td><td class="r"><span class="in">${parseFloat(l.q)}</span></td></tr>`).join('')}</tbody></table></div>`})
document.getElementById('root').innerHTML=O.map(o=>`<div class="opt"><h2>${o.t}</h2>${o.s?`<p class="src">${o.s}</p>`:''}<p class="why">${o.w}</p>${o.t.startsWith('G')?'':head()}${o.r()}</div>`).join('')
</script></body></html>
